<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SYSTEM OVERRIDE</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
background:#000;color:#f00;font-family:monospace
}
body{display:flex;align-items:center;justify-content:center}
#bg{
position:fixed;inset:0;
background:
repeating-linear-gradient(0deg,transparent 0,transparent 3px,#f0000010 4px),
radial-gradient(circle at center,#250000,#000 70%);
animation:pulse 1s infinite alternate
}
@keyframes pulse{to{filter:brightness(1.4)}}
#flash{
position:fixed;inset:0;background:red;opacity:0;
z-index:30;pointer-events:none
}
.flash{animation:flash .12s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

.panel{
position:relative;z-index:5;
width:min(94%,560px);
padding:22px;text-align:center;
background:#050000ee;
border:2px solid red;
box-shadow:0 0 40px #f00;
border-radius:8px
}
.eye{
font-size:70px;
animation:eye 1s infinite alternate
}
@keyframes eye{
to{transform:scale(1.2);filter:drop-shadow(0 0 20px red)}
}
h1{
font-size:clamp(30px,9vw,55px);
margin:4px;
text-shadow:0 0 15px red,0 0 35px red;
animation:glitch .13s infinite
}
@keyframes glitch{
0%{transform:translate(0)}
25%{transform:translate(3px,-2px)}
50%{transform:translate(-3px,2px)}
75%{transform:translate(2px,1px)}
100%{transform:translate(0)}
}
.warning{
font-size:18px;font-weight:bold;
animation:blink .45s infinite
}
@keyframes blink{50%{opacity:.15}}

#terminal{
height:190px;overflow:hidden;text-align:left;
background:#010000;border:1px solid #700;
padding:12px;margin:18px 0;
font-size:12px;color:#ff3333
}
.line{margin:5px 0}

#timer{
font-size:65px;
font-weight:bold;
text-shadow:0 0 25px red
}
input{
width:230px;max-width:90%;
padding:14px;
background:#100000;
border:2px solid red;
color:white;
text-align:center;
font:22px monospace;
outline:none
}
button{
padding:13px 22px;
margin:8px;
background:#250000;
border:1px solid red;
color:white;
font:bold 16px monospace
}
#result{
display:none;
position:fixed;inset:0;z-index:50;
background:#000;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:20px
}
#result h2{
font-size:clamp(40px,11vw,80px);
color:white;
text-shadow:0 0 25px red
}
.green{color:#00ff66}
#exit{
position:fixed;right:7px;top:7px;
z-index:100;opacity:.25;
font-size:10px;padding:5px
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="flash"></div>

<button id="exit" onclick="safeExit()">EXIT</button>

<div class="panel" id="intro">
<div class="eye">👁️</div>
<h1>SYSTEM OVERRIDE</h1>
<p class="warning">⚠ CRITICAL SECURITY EVENT ⚠</p>
<p>Unauthorized system activity has been simulated.</p>
<button onclick="activate()">BEGIN SIMULATION</button>
</div>

<div class="panel" id="scan" style="display:none">
<div class="eye">👁️</div>
<h1>DEVICE SCAN</h1>
<p class="warning">ANALYZING...</p>
<div id="terminal"></div>
<div id="timer">20</div>
<p>ENTER OVERRIDE CODE</p>
<input id="code" maxlength="9" inputmode="numeric"
placeholder="•••••••••">
<br>
<button onclick="unlock()">OVERRIDE</button>
</div>

<div id="result">
<div style="font-size:80px">😂</div>
<h2>YOU GOT PRANKED!</h2>
<p class="green" style="font-size:22px">
NOTHING WAS HACKED.
</p>
<p>This was only a harmless simulation.</p>
<button onclick="location.reload()">RUN AGAIN</button>
</div>

<script>
const intro=document.getElementById("intro");
const scan=document.getElementById("scan");
const terminal=document.getElementById("terminal");
const timerBox=document.getElementById("timer");
const code=document.getElementById("code");
const flash=document.getElementById("flash");
const result=document.getElementById("result");

let countdown;

function beep(freq=300,d=.07){
try{
let a=new AudioContext();
let o=a.createOscillator();
let g=a.createGain();
o.type="square";
o.frequency.value=freq;
g.gain.value=.025;
o.connect(g);
g.connect(a.destination);
o.start();
o.stop(a.currentTime+d);
}catch(e){}
}

function log(t){
let d=document.createElement("div");
d.className="line";
d.textContent=t;
terminal.appendChild(d);
terminal.scrollTop=terminal.scrollHeight;
}

function flashScreen(){
flash.classList.remove("flash");
void flash.offsetWidth;
flash.classList.add("flash");
}

function activate(){

intro.style.display="none";
scan.style.display="block";

const logs=[
"> SYSTEM INITIALIZATION...",
"> SECURITY CORE ONLINE",
"> SIMULATED NETWORK SCAN STARTED",
"> UNKNOWN SIGNAL DETECTED",
"> ANALYZING CONNECTION...",
"> ENCRYPTED CHANNEL FOUND",
"> SECURITY BARRIER ACTIVE",
"> ACCESS ATTEMPT DETECTED",
"> OVERRIDE PROTOCOL READY"
];

let i=0;

let logsTimer=setInterval(()=>{
log(logs[i]);
beep(180+i*30);

if(i===3||i===6)flashScreen();

i++;

if(i>=logs.length)clearInterval(logsTimer);
},600);

let n=20;

countdown=setInterval(()=>{
n--;
timerBox.textContent=n;

if(n<=5){
timerBox.style.color="white";
flashScreen();
beep(650,.05);
}else{
beep(240,.04);
}

if(n<=0){
clearInterval(countdown);
showResult();
}
},1000);

code.focus();
}

function unlock(){

if(code.value==="123456789"){
clearInterval(countdown);
log("> OVERRIDE ACCEPTED");
beep(900,.3);
setTimeout(showResult,500);
}else{
log("> ACCESS DENIED");
code.value="";
code.focus();
beep(70,.2);
flashScreen();
}
}

function showResult(){
scan.style.display="none";
result.style.display="flex";
}

function safeExit(){
clearInterval(countdown);
location.href="index.html";
}

code.addEventListener("keydown",e=>{
if(e.key==="Enter")unlock();
});
</script>

</body>
</html>
